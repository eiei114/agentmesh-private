# One grouped PR per ecosystem per week. Pi SDK packages (@earendil-works/*)
# move together in their own group so they never arrive as conflicting
# per-package PRs. Security updates stay ungrouped.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: tuesday
    time: "02:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - dependabot
  - maintenance
  commit-message:
    prefix: chore
    include: scope
  groups:
    cargo-dependencies:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: tuesday
    time: "02:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - dependabot
  - maintenance
  - ci
  commit-message:
    prefix: chore
    include: scope
  groups:
    github-actions-dependencies:
      patterns:
      - "*"
