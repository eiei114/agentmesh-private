[workspace]
resolver = "2"
members = [
    "crates/agentmesh-proto",
    "crates/agentmesh-host",
    "crates/agentmesh-cli",
    "crates/agentmesh-app",
    "crates/agentmesh-conformance",
    "crates/agentmesh-request-evidence",
    "crates/agentmesh-evidence",
    "test-support/agentmesh-fixture-support",
    "plugins/fixtures/echo",
    "plugins/fixtures/bad-json",
    "plugins/fixtures/bad-schema",
    "plugins/fixtures/sleep",
    "plugins/fixtures/exit-nonzero",
    "plugins/fixtures/stderr-success",
    "plugins/multica-selector-shadow",
    "plugins/markdown-request-validator",
    "plugins/non-multica-request-adapter",
    "plugins/local-tracker-adapter",
    "plugins/local-runner-adapter",
    "plugins/adapter-metadata-canonicalizer",
    "plugins/lane-run-ledger",
]
default-members = [
    "crates/agentmesh-proto",
    "crates/agentmesh-host",
    "crates/agentmesh-cli",
    "crates/agentmesh-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.97"

[workspace.dependencies]
agentmesh-proto = { path = "crates/agentmesh-proto" }
agentmesh-host = { path = "crates/agentmesh-host" }
agentmesh-fixture-support = { path = "test-support/agentmesh-fixture-support" }
agentmesh-multica-selector-shadow = { path = "plugins/multica-selector-shadow" }
agentmesh-markdown-request-validator = { path = "plugins/markdown-request-validator" }
agentmesh-lane-run-ledger = { path = "plugins/lane-run-ledger" }
agentmesh-non-multica-request-adapter = { path = "plugins/non-multica-request-adapter" }
agentmesh-local-tracker-adapter = { path = "plugins/local-tracker-adapter" }
agentmesh-local-runner-adapter = { path = "plugins/local-runner-adapter" }
agentmesh-adapter-metadata-canonicalizer = { path = "plugins/adapter-metadata-canonicalizer" }
agentmesh-app = { path = "crates/agentmesh-app" }
agentmesh-request-evidence = { path = "crates/agentmesh-request-evidence" }
agentmesh-evidence = { path = "crates/agentmesh-evidence" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "fs"] }
bytes = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.16", features = ["v4"] }
schemars = "1.2"
tempfile = "3.20"
proptest = "1.6"
assert_cmd = "2.0"
predicates = "3.1"
which = "8.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cognitive_complexity = "allow"
identity_op = "allow"
field_reassign_with_default = "allow"
needless_continue = "allow"
match_same_arms = "allow"
single_match_else = "allow"
if_same_then_else = "allow"
map_unwrap_or = "allow"
never_loop = "allow"
useless_vec = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
