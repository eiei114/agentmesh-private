schema_version = "agentmesh-app.v0"
name = "production-controller-observer"
protocol_version = "2026-07-15"

[plugin]
logical_name = "agentmesh-production-controller-observer"

[schemas]
input = "schemas/production-controller-observer-input-v0.schema.json"
output = "schemas/production-controller-observer-output-v0.schema.json"

[sidecar]
retention_class = "owner_local"
capture_plugin_stderr = false

[env]
allowlist = ["USERPROFILE", "LOCALAPPDATA", "APPDATA", "PROGRAMDATA"]

[limits]
run_timeout_ms = 120000

[conformance]
cargo_package = "agentmesh-production-controller-observer"
