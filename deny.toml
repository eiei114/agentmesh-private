# cargo-deny configuration for private Phase 0.
# Public license/advisory policy is deferred to the publication gate.

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Private unpublished workspace crates use UNLICENSED until the publication gate.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
