name: ci

on:
  push:
    branches: [main, phase0-contract-spike, campaign/agentmesh-multica-operations]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: release build
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p agentmesh-cli
          -p agentmesh-multica-selector-shadow
          -p agentmesh-fixture-echo

      - name: package artifacts
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          SHA="$(git rev-parse --short=12 HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          OUT="dist/${TARGET}"
          BIN_DIR="target/${TARGET}/release"
          TAG="v0.1.0-ci.${SHA}"
          python3 scripts/package_toolchain_bundle.py \
            --out "$OUT" \
            --target "$TARGET" \
            --tag "$TAG" \
            --commit "$FULL_SHA" \
            --bin-dir "$BIN_DIR" \
            --also-flat-phase0-manifest \
            --include-echo
          test -f "$OUT/release-manifest.json"
          test -f "$OUT/pin.generated.toml"
          python3 scripts/verify_artifact_manifest.py "$OUT/manifest.json"
          ARTIFACT_NAME="agentmesh-0.1.0-${TARGET}-${SHA}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          mkdir -p upload
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            python3 scripts/zipdir.py zip "$OUT" "upload/${ARTIFACT_NAME}.zip"
          else
            tar -C "$OUT" -czf "upload/${ARTIFACT_NAME}.tar.gz" .
          fi

      - name: downloaded artifact smoke
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          WORK="$(mktemp -d)"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            python3 scripts/zipdir.py unzip "upload/${ARTIFACT_NAME}.zip" "$WORK"
          else
            tar -C "$WORK" -xzf "upload/${ARTIFACT_NAME}.tar.gz"
          fi
          python3 scripts/smoke_downloaded_bundle.py --bundle "$WORK" --target "$TARGET"

      - name: upload immutable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.97.0"
